apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spark-ingestion.fullname" . }}-config
  labels:
    {{- include "spark-ingestion.labels" . | nindent 4 }}
data:
  INGESTION_METADATA_STORE_TYPE: {{ .Values.config.metadataStoreType | default "filesystem" | quote }}
  INGESTION_METADATA_DIR: {{ .Values.config.metadataDir | default "./data" | quote }}
  INGESTION_PIPELINES_DIR: {{ .Values.config.pipelinesDir | default "./pipelines" | quote }}
  INGESTION_K8S_MASTER_URL: {{ .Values.config.k8sMasterUrl | default "https://kubernetes.default.svc" | quote }}
  INGESTION_SPARK_IMAGE: "{{ .Values.sparkImage.repository }}:{{ .Values.sparkImage.tag }}"
  INGESTION_SPARK_NAMESPACE: {{ .Values.spark.namespace | quote }}
  INGESTION_SPARK_SERVICE_ACCOUNT: {{ .Values.spark.serviceAccount | quote }}
  INGESTION_DEFAULT_EXECUTION_MODE: {{ .Values.config.defaultExecutionMode | default "k8s" | quote }}
  INGESTION_DEFAULT_DEPLOY_MODE: {{ .Values.config.defaultDeployMode | default "cluster" | quote }}
  INGESTION_MAX_CONCURRENT_JOBS: {{ .Values.config.maxConcurrentJobs | default 10 | quote }}
  {{- if .Values.config.bqProjectId }}
  INGESTION_BQ_PROJECT_ID: {{ .Values.config.bqProjectId | quote }}
  {{- end }}
  {{- if .Values.config.bqDataset }}
  INGESTION_BQ_DATASET: {{ .Values.config.bqDataset | quote }}
  {{- end }}
  {{- if .Values.config.dataprocProject }}
  INGESTION_DATAPROC_PROJECT: {{ .Values.config.dataprocProject | quote }}
  INGESTION_DATAPROC_REGION: {{ .Values.config.dataprocRegion | quote }}
  INGESTION_DATAPROC_CLUSTER: {{ .Values.config.dataprocCluster | quote }}
  {{- end }}
